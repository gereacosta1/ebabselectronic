# netlify.toml

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"


# ==========================================================
# API - AFFIRM
# ==========================================================

[[redirects]]
  from = "/api/affirm-authorize"
  to = "/.netlify/functions/affirm-authorize"
  status = 200


# ==========================================================
# API - STRIPE CHECKOUT
# ==========================================================

[[redirects]]
  from = "/api/card-checkout"
  to = "/.netlify/functions/card-checkout"
  status = 200


# ==========================================================
# API - HEALTH CHECK
# ==========================================================

[[redirects]]
  from = "/api/ping"
  to = "/.netlify/functions/ping"
  status = 200


# ==========================================================
# SPA FALLBACK
# IMPORTANTE: siempre debe estar después de las rutas API.
# ==========================================================

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200


# ==========================================================
# HEADERS - AFFIRM
# ==========================================================

[[headers]]
  for = "/affirm/*"

  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"


# ==========================================================
# HEADERS - API
# ==========================================================

[[headers]]
  for = "/api/*"

  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"


# ==========================================================
# SECURITY HEADERS - WEBSITE
# ==========================================================

[[headers]]
  for = "/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"


# ==========================================================
# ENVIRONMENTS
#
# Las claves privadas NO deben ponerse acá.
#
# STRIPE_SECRET_KEY
# AFFIRM_PRIVATE_KEY
# AFFIRM_PUBLIC_KEY
#
# deben permanecer en Netlify Environment Variables.
# ==========================================================

[context.production.environment]
  AFFIRM_ENV = "prod"
  VITE_AFFIRM_ENV = "prod"

[context.deploy-preview.environment]
  AFFIRM_ENV = "prod"
  VITE_AFFIRM_ENV = "prod"

[context.branch-deploy.environment]
  AFFIRM_ENV = "prod"
  VITE_AFFIRM_ENV = "prod"